<!doctype html><html lang="el"><head><meta charset="utf-8"><title>Wall · Στιλ εικονιδίων</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0f1316;color:#e9eef2;font-family:Manrope,sans-serif;padding:22px 26px}
body.light{background:#eef1f4;color:#1c2228}
h1{font-size:22px;margin:0 0 4px}p.s{color:#93a0ab;margin:0 0 18px;font-size:14px}
.row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.lab{width:150px;flex:none}.lab b{display:block;font-size:20px}.lab small{color:#93a0ab;font-size:12px;line-height:1.3;display:block}
.tiles{display:flex;gap:10px}
.t{width:96px;height:96px;border-radius:20px;background:#1b2127;position:relative;display:grid;place-items:center}
.light .t{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.t.on{background:color-mix(in srgb,var(--c) 22%,#1b2127);outline:2px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:-2px}
.light .t.on{background:color-mix(in srgb,var(--c) 16%,#fff)}
.t svg{width:60px;height:60px}
.t .v{position:absolute;left:12px;bottom:9px;font-weight:800;font-size:15px}
.t .v small{font-size:11px;color:#93a0ab;font-weight:700}
.t.wv svg{width:50px;height:50px;margin-bottom:20px}
/* Α: γραμμή */
.A *{fill:none;stroke:#cfd8df;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.light .A *{stroke:#3a444d}
.A .ac{stroke:var(--c)}.A .fl{fill:none}
.on .A *{stroke:var(--c)}
/* Β: duotone */
.B *{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.B .b{fill:color-mix(in srgb,var(--c) 28%,transparent)}.B .ac{fill:var(--c);stroke:none}.B .fl{fill:color-mix(in srgb,var(--c) 55%,transparent)}
.t:not(.on) .B *{stroke:#7d8a95}.t:not(.on) .B .b{fill:#7d8a9533}.t:not(.on) .B .ac{fill:#7d8a95}
/* Γ: εικονογράφηση (γεμάτα χρώματα) */
.C .b{fill:#e8edf1;stroke:none}.C .d{fill:#b9c3cc}.C .k{fill:#56636e}.C *{stroke:none}
.C .ac{fill:var(--c)}.C .fl{fill:color-mix(in srgb,var(--c) 60%,#fff)}.C .ln{fill:none;stroke:#56636e;stroke-width:2;stroke-linecap:round}
.t:not(.on) .C{filter:saturate(.15) brightness(.85)}
/* Δ: 3D με διαβαθμίσεις */
.D .b{fill:url(#gb);stroke:none}.D .d{fill:url(#gd)}.D .k{fill:#3d4851}.D *{stroke:none}
.D .ac{fill:var(--c);filter:drop-shadow(0 0 3px var(--c))}.D .fl{fill:url(#ga)}.D .ln{fill:none;stroke:#3d4851;stroke-width:2;stroke-linecap:round}
.D{filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.t:not(.on) .D .ac{filter:none;fill:#7d8a95}.t:not(.on) .D .fl{fill:#9aa4ad}
/* κίνηση όταν λειτουργεί */
.on .spin{animation:sp 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
.on .wob{animation:wb 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.on .blink{animation:bl 1.4s steps(2) infinite}
.on .rise{animation:rs 2s ease-in infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes wb{50%{transform:translateX(1.5px)}}@keyframes bl{50%{opacity:.2}}@keyframes rs{from{transform:translateY(3px);opacity:0}50%{opacity:1}to{transform:translateY(-5px);opacity:0}}
.bar{display:flex;gap:10px;margin-bottom:18px}.bar button{border:0;border-radius:12px;padding:8px 14px;font:700 13px Manrope;background:#252d35;color:#e9eef2;cursor:pointer}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d2d9"/></linearGradient>
<linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa6b0"/><stop offset="1" stop-color="#5e6b76"/></linearGradient>
<linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe6ff"/><stop offset="1" stop-color="#3d8fe6"/></linearGradient>
</defs></svg>
<h1>Στιλ εικονιδίων συσκευών</h1>
<p class="s">Κάθε πλακίδιο εμφανίζεται χωρίς όνομα. Η πρώτη σειρά κάθε στιλ δείχνει τις συσκευές σβηστές και η δεύτερη αναμμένες, με κίνηση. Πάνω αριστερά μπορείς να αλλάξεις ανάμεσα σε σκοτεινό και ανοιχτό θέμα.</p>
<div class="bar"><button onclick="document.body.classList.toggle('light')">Σκοτεινό / Ανοιχτό</button><button onclick="document.querySelectorAll('.t').forEach(t=>t.classList.toggle('wv'))">Με / χωρίς τιμή</button></div>
<div id="out"></div>
<script>
/* Κοινή γεωμετρία· κάθε στιλ χρωματίζει τις κλάσεις b (σώμα), d (λεπτομέρεια), k (σκούρο), ac (τόνος), fl (υγρό/γυαλί), ln (γραμμή) */
const I = {
  washer: ['#3d8fe6', `<rect class="b" x="9" y="5" width="30" height="38" rx="5"/><rect class="d" x="9" y="5" width="30" height="8" rx="4"/><circle class="k" cx="15" cy="9" r="1.6"/><rect class="ac" x="24" y="8" width="11" height="2.4" rx="1.2"/><circle class="d" cx="24" cy="28" r="11"/><circle class="fl" cx="24" cy="28" r="8"/><path class="ln spin" d="M18 29q3-4 6 0t6 0"/>`, '42′'],
  dryer: ['#e0a020', `<rect class="b" x="9" y="5" width="30" height="38" rx="5"/><rect class="d" x="9" y="5" width="30" height="8" rx="4"/><circle class="ac blink" cx="15" cy="9" r="1.8"/><circle class="k" cx="31" cy="9" r="2.4"/><circle class="d" cx="24" cy="28" r="11"/><circle class="k" cx="24" cy="28" r="8"/><g class="spin"><path class="ac" d="M24 22c2 2 2 4 0 6s-2 4 0 6c-4-1-5-4-3-6s2-4 3-6z"/></g>`, '23′'],
  dishwasher: ['#3aa6b0', `<rect class="b" x="8" y="5" width="32" height="38" rx="5"/><rect class="d" x="8" y="5" width="32" height="7" rx="3.5"/><rect class="k" x="17" y="7.6" width="14" height="2" rx="1"/><rect class="d" x="12" y="16" width="24" height="22" rx="3"/><g class="rise"><circle class="fl" cx="18" cy="31" r="2"/><circle class="fl" cx="25" cy="27" r="2.6"/><circle class="fl" cx="31" cy="32" r="1.7"/></g><rect class="ac" x="12" y="39.5" width="24" height="1.8" rx=".9"/>`, '1ω 12′'],
  heater: ['#e0603a', `<rect class="b" x="13" y="3" width="22" height="40" rx="11"/><rect class="d" x="13" y="28" width="22" height="15" rx="2"/><path class="k" d="M18 43h4v3h-4zM26 43h4v3h-4z"/><g class="wob"><path class="ac" d="M24 13c4 4 5 6 5 8a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 0-5 1-7z"/></g><circle class="k" cx="24" cy="35" r="2.6"/>`, '12′'],
  vacuum: ['#7a5fd0', `<circle class="b" cx="24" cy="26" r="17"/><circle class="d" cx="24" cy="26" r="12"/><circle class="k" cx="24" cy="18" r="4"/><circle class="ac blink" cx="24" cy="18" r="1.6"/><rect class="k" x="14" y="38" width="20" height="3" rx="1.5"/><g class="spin" style="transform-origin:10px 38px"><path class="ln" d="M7 38l5-2M7 34l5 2"/></g>`, 'Καθαρίζει'],
  printer: ['#d0662f', `<rect class="d" x="6" y="5" width="36" height="38" rx="4"/><rect class="b" x="10" y="9" width="28" height="30" rx="2"/><rect class="k" x="10" y="13" width="28" height="2.4"/><g class="wob"><rect class="k" x="19" y="11" width="10" height="7" rx="1.5"/><path class="k" d="M22 18h4l-2 3z"/></g><path class="ac" d="M17 35h14l-2-8h-10z"/><rect class="k" x="12" y="35" width="24" height="2"/>`, '64%'],
  router: ['#2f9a76', `<rect class="b" x="6" y="27" width="36" height="12" rx="4"/><circle class="ac blink" cx="13" cy="33" r="1.8"/><circle class="ac" cx="19" cy="33" r="1.8"/><circle class="ac blink" cx="25" cy="33" r="1.8" style="animation-delay:.5s"/><path class="d" d="M11 27l-2-14h3l2 14zM37 27l2-14h-3l-2 14z"/><path class="ln" d="M18 17a8 8 0 0 1 12 0M21 21a4 4 0 0 1 6 0"/>`, 'Online'],
  ac: ['#3d8fe6', `<rect class="b" x="4" y="10" width="40" height="17" rx="5"/><rect class="d" x="8" y="22" width="32" height="2.6" rx="1.3"/><circle class="ac" cx="37" cy="15" r="1.6"/><g class="rise"><path class="ln" d="M14 31q2 4 0 8M24 31q2 4 0 8M34 31q2 4 0 8"/></g>`, '22°'],
  boiler: ['#e0603a', `<rect class="b" x="10" y="4" width="28" height="34" rx="4"/><rect class="k" x="15" y="9" width="18" height="7" rx="2"/><rect class="ac" x="18" y="11.2" width="7" height="2.6" rx="1"/><circle class="d" cx="24" cy="27" r="6"/><g class="wob"><path class="ac" d="M24 23c2 2 3 3 3 4.5a3 3 0 0 1-6 0c0-1 .6-1.8 1.2-2.4 0 1 .6 1.6 1.2 1.6 0-1.6 0-2.6.6-3.7z"/></g><path class="k" d="M15 38h3v6h-3zM22.5 38h3v6h-3zM30 38h3v6h-3z"/>`, '21°'],
  dehum: ['#3d7fe0', `<rect class="b" x="11" y="4" width="26" height="40" rx="6"/><rect class="d" x="15" y="8" width="18" height="10" rx="3"/><path class="ln" d="M16 24h16M16 28h16M16 32h16"/><rect class="fl" x="15" y="36" width="18" height="5" rx="1.5"/><g class="rise"><path class="ac" d="M24 9.5c2 2.3 3 3.8 3 5a3 3 0 0 1-6 0c0-1.2 1-2.7 3-5z"/></g>`, '63%'],
  purifier: ['#2f86d9', `<rect class="b" x="12" y="6" width="24" height="38" rx="9"/><circle class="d" cx="24" cy="17" r="7"/><g class="spin"><path class="ac" d="M24 17l0-5a3 3 0 0 1 0 5l5 0a3 3 0 0 1-5 0l0 5a3 3 0 0 1 0-5l-5 0a3 3 0 0 1 5 0z"/></g><path class="ln" d="M17 29h14M17 33h14M17 37h14"/>`, 'Medium'],
};
const STY = [['A', 'Γραμμή', 'Λεπτό περίγραμμα, όπως τώρα αλλά σχεδιασμένο για κάθε συσκευή. Χρώμα μόνο όταν λειτουργεί.'],
  ['B', 'Duotone', 'Περίγραμμα με απαλό γέμισμα στο χρώμα της συσκευής. Πιο ευανάγνωστο από μακριά.'],
  ['C', 'Εικονογράφηση', 'Γεμάτα σχήματα σαν μικρή ζωγραφιά της συσκευής. Αναγνωρίζεται ακόμη και χωρίς όνομα.'],
  ['D', 'Soft 3D', 'Διαβαθμίσεις και σκιά, με φωτεινό τόνο όταν λειτουργεί. Πιο «παιχνιδιάρικο».']];
document.getElementById('out').innerHTML = STY.map(([k, n, d]) => [false, true].map((on) => `<div class="row"><div class="lab">${on ? '' : `<b>${k} · ${n}</b><small>${d}</small>`}</div><div class="tiles">${Object.entries(I).map(([id, [c, g, v]]) =>
  `<div class="t${on ? ' on' : ''} wv" style="--c:${c}"><svg viewBox="0 0 48 48" class="${k}">${g}</svg><span class="v">${on ? v : ''}</span></div>`).join('')}</div></div>`).join('')).join('');
</script></body></html>

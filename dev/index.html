<!doctype html>
<!-- Σελίδα ανάπτυξης: δείχνει τις κάρτες με ψεύτικα entities, χωρίς σύνδεση στο Home Assistant.
     Άνοιγμα: http://<HA>/local/wall-cards/dev/index.html -->
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Cards · dev</title>
<style>
  body{margin:0;padding:24px;background:linear-gradient(160deg,#eef1f4,#dde3e8);min-height:100vh;box-sizing:border-box;font-family:sans-serif}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,220px);grid-auto-rows:228px;grid-auto-flow:dense;gap:12px}
  #grid > *{min-height:0}
  .tall{grid-row:span 2}
  .wide{grid-column:span 2}
  pre{font:12px monospace;color:#5b6670;margin-top:16px;white-space:pre-wrap;max-height:160px;overflow:auto}
</style>
</head>
<body>
<div id="grid"></div>
<pre id="log"></pre>
<script type="module">
/* Το ?t= παρακάμπτει την κρυφή μνήμη του /local/ (31 ημέρες) */
await import('../dist/wall-cards.js?t=' + Date.now());

const now = () => new Date().toISOString();
const S = (state, attributes = {}) => ({ state: String(state), attributes, last_updated: now() });
const states = {
  'light.demo': S('on', { friendly_name: 'Φως υπνοδωματίου', brightness: 160, supported_color_modes: ['color_temp', 'hs'], color_mode: 'color_temp', color_temp_kelvin: 2700 }),
  'switch.lamp': S('off', { friendly_name: 'Φωτιστικό γραφείου' }),
  'lock.door': S('locked', { friendly_name: 'Door' }),
  'sensor.batt': S(76),
  'lock.opener': S('locked', { friendly_name: 'Entrance' }),
  'input_select.wash': S('on'), 'sensor.rem': S('0:42:00'), 'sensor.tot': S('1:12:00'),
  'sensor.course': S('Cotton'), 'sensor.temp': S('40℃'), 'button.pause': S('unknown'), 'button.start': S('unknown'),
  'binary_sensor.dry': S('on'), 'sensor.dry_rem': S(65, { unit_of_measurement: 'min' }), 'sensor.dry_tot': S(100, { unit_of_measurement: 'min' }),
  'input_select.dish': S('finished', { options: ['on', 'off', 'finished'] }),
  'climate.boiler': S('heat', { friendly_name: 'Λέβητας', temperature: 22, current_temperature: 21.3, hvac_action: 'heating', target_temp_step: 0.5, min_temp: 5, max_temp: 30 }),
  'climate.ac': S('cool', { friendly_name: 'Κλιματιστικό', temperature: 23, current_temperature: 24.7, target_temp_step: 0.5, min_temp: 16, max_temp: 30, hvac_modes: ['off', 'cool', 'heat', 'dry', 'fan_only'], fan_modes: ['auto', 'low', 'medium', 'high'], fan_mode: 'auto', swing_modes: ['off', 'vertical', 'horizontal', 'both'], swing_mode: 'vertical' }),
  'switch.heater': S('off'), 'timer.heater': S('idle', { duration: '0:15:00' }),
  'binary_sensor.pur': S('on'), 'input_select.pur': S('Medium', { options: ['Off', 'Sleep', 'Low', 'Medium', 'High'] }), 'script.pur_on': S('off'), 'script.pur_off': S('off'), 'sensor.pm25': S(8),
  'sensor.co2': S(640), 'sensor.voc': S('Χαμ.'), 'sensor.pm10': S(14),
  'vacuum.robo': S('docked', { battery_level: 100 }), 'sensor.area': S(0),
  'media_player.tv': S('playing', { friendly_name: 'Τηλεόραση', app_name: 'Netflix', media_title: 'Ντοκιμαντέρ', media_series_title: 'Σεζόν 2', is_volume_muted: false, media_duration: 3600, media_position: 650, media_position_updated_at: now() }),
  'media_player.music': S('playing', { friendly_name: 'Σαλόνι', app_name: 'Music Assistant', media_title: 'Το τρένο φεύγει στις 8', media_artist: 'Μίκης Θεοδωράκης', media_duration: 200, media_position: 76, media_position_updated_at: now() }),
  'sensor.lr_t': S(25.1), 'sensor.lr_h': S(61), 'sensor.br_t': S(22.6), 'sensor.br_h': S(70), 'sensor.home_t': S(24.1), 'sensor.home_h': S(64),
  'person.chris': S('not_home', { friendly_name: 'Chris', latitude: 40.8008, longitude: 22.0475 }), 'sensor.chris_dist': S('337', { unit_of_measurement: 'm' }),
  'sensor.chris_addr': S('Αριστοτέλους 12, Έδεσσα, Πέλλα 582 00, Ελλάδα'), 'binary_sensor.chris_drv': S('off'),
  'person.ioanna': S('home', { friendly_name: 'Ioanna', latitude: 40.80, longitude: 22.04 }),
  'humidifier.dehum': S('on', { humidity: 55, min_humidity: 30, max_humidity: 80, current_humidity: 64 }),
  'sensor.dehum_h': S(64, { device_class: 'humidity', friendly_name: 'Dehumidifier Humidity' }),
  'select.dehum_room': S('Bedroom', { options: ['Bedroom', 'Home', 'Kitchen', 'Living Room', 'Master Bedroom'] }),
  'sensor.dehum_w': S(320, { unit_of_measurement: 'W' }),
  'sensor.lrh': S(61, { device_class: 'humidity', friendly_name: 'Living Room Sensor Humidity' }),
  'sensor.mbh': S(70, { device_class: 'humidity', friendly_name: 'Master Bedroom Sensor Humidity' }),
  'sensor.bh': S('unavailable', { device_class: 'humidity', friendly_name: 'Bedroom Multisensor Humidity' }),
  'sensor.hh': S(64, { device_class: 'humidity', friendly_name: 'Home Humidity' }),
  'weather.home': S('partlycloudy', { friendly_name: 'Έδεσσα', temperature: 17 }), 'sun.sun': S('above_horizon'),
  'sensor.car': S(78), 'sensor.range': S(392, { unit_of_measurement: 'km' }), 'device_tracker.car': S('home'),
  'binary_sensor.charging': S('on'), 'lock.car': S('locked'), 'climate.car': S('off'), 'switch.charger': S('on'), 'button.find': S('unknown'),
};
const cards = [];
const logEl = document.getElementById('log');
const log = (t) => (logEl.textContent = t + '\n' + logEl.textContent);
const set = (id, state, attrs) => { states[id] = S(state ?? states[id].state, { ...states[id].attributes, ...attrs }); push(); };

/* Ψεύτικο Home Assistant: καταγράφει την κλήση και αλλάζει την κατάσταση όπως θα έκανε η συσκευή */
function react(domain, service, d) {
  const id = d.entity_id, cur = states[id];
  const flip = () => set(id, cur.state === 'on' ? 'off' : 'on');
  if (service === 'toggle' && domain !== 'media_player') return flip();
  if (domain === 'homeassistant') return set(id, service === 'turn_on' ? 'on' : 'off');
  if (domain === 'light') return set(id, 'on', d.brightness_pct ? { brightness: Math.round(d.brightness_pct * 2.55) } : d.rgb_color ? { rgb_color: d.rgb_color, color_mode: 'hs' } : { color_temp_kelvin: d.color_temp_kelvin, color_mode: 'color_temp' });
  if (domain === 'input_select' || domain === 'select') return set(id, d.option);
  if (domain === 'humidifier') return service === 'set_humidity' ? set(id, null, { humidity: d.humidity }) : set(id, cur.state === 'on' ? 'off' : 'on');
  if (domain === 'script') return set('binary_sensor.pur', id === 'script.pur_on' ? 'on' : 'off');
  if (domain === 'lock') return service === 'open' ? null : set(id, service === 'lock' ? 'locked' : 'unlocked');
  if (domain === 'button') {
    if (id === 'button.pause') set('input_select.wash', 'paused');
    if (id === 'button.start') set('input_select.wash', 'on');
    return;
  }
  if (domain === 'climate') {
    if (service === 'set_temperature') return set(id, null, { temperature: d.temperature });
    if (service === 'set_hvac_mode') return set(id, d.hvac_mode);
    if (service === 'set_fan_mode') return set(id, null, { fan_mode: d.fan_mode });
    if (service === 'set_swing_mode') return set(id, null, { swing_mode: d.swing_mode });
    return set(id, service === 'turn_off' ? 'off' : id === 'climate.ac' ? 'cool' : 'heat');
  }
  if (domain === 'timer') {
    if (service === 'cancel') return set(id, 'idle', { finishes_at: undefined });
    const [h, m, s] = d.duration.split(':').map(Number);
    return set(id, 'active', { duration: d.duration, finishes_at: new Date(Date.now() + (h * 3600 + m * 60 + s) * 1000).toISOString() });
  }
  if (domain === 'vacuum') return set(id, { start: 'cleaning', pause: 'paused', return_to_base: 'docked' }[service], service === 'start' ? {} : {});
  if (domain === 'media_player') {
    if (service === 'toggle') return set(id, cur.state === 'off' ? 'playing' : 'off');
    if (service === 'volume_mute') return set(id, null, { is_volume_muted: d.is_volume_muted });
    if (service === 'media_play_pause') return set(id, cur.state === 'playing' ? 'paused' : 'playing', { media_position_updated_at: now() });
    return set(id, null, { media_title: service === 'media_next_track' ? 'Midnight City' : 'Ένα το χελιδόνι', media_artist: service === 'media_next_track' ? 'M83' : 'Γρηγόρης Μπιθικώτσης', media_position: 0, media_position_updated_at: now() });
  }
}
const hass = {
  states,
  /* Ιστορικό 24 ωρών: ημιτονοειδής καμπύλη γύρω από την τωρινή τιμή, σε συμπιεσμένη μορφή όπως το HA */
  async callWS(msg) {
    if (msg.type !== 'history/history_during_period') return {};
    const out = {};
    for (const id of msg.entity_ids) {
      const v = parseFloat(states[id]?.state);
      out[id] = Array.from({ length: 49 }, (_, i) => ({ s: String(v + Math.sin(i / 8 + id.length) * (id.endsWith('_h') ? 6 : 1.5) - (id.endsWith('_h') ? (48 - i) / 8 : 0)), lu: (Date.now() - (48 - i) * 1800000) / 1000 }));
    }
    return out;
  },
  /* Πρόγνωση με συνδρομή, όπως το weather/subscribe_forecast */
  connection: {
    subscribeMessage(cb, msg) {
      const day = 86400000, hour = 3600000, now = Date.now();
      const forecast = msg.forecast_type === 'daily'
        ? [['partlycloudy', 24, 11], ['cloudy', 21, 12], ['rainy', 18, 10], ['sunny', 23, 11], ['sunny', 25, 13]].map(([condition, temperature, templow], i) => ({ datetime: new Date(now + i * day).toISOString(), condition, temperature, templow }))
        : Array.from({ length: 24 }, (_, i) => ({ datetime: new Date(now + (i + 1) * hour).toISOString(), condition: i >= 5 && i <= 8 ? 'rainy' : 'cloudy', temperature: 17 - i * 0.2, precipitation_probability: i >= 5 && i <= 8 ? 70 : 10 }));
      setTimeout(() => cb({ forecast }), 50);
      return Promise.resolve(() => {});
    },
  },
  callService(domain, service, data) {
    log(`${domain}.${service} ${JSON.stringify(data)}`);
    setTimeout(() => react(domain, service, data), 300);
    return Promise.resolve();
  },
};
const push = () => cards.forEach((c) => (c.hass = hass));
const add = (tag, config, cls) => {
  const el = document.createElement(tag);
  el.setConfig(config);
  if (cls) el.className = cls;
  el.addEventListener('hass-more-info', (e) => log('more-info ' + e.detail.entityId));
  document.getElementById('grid').appendChild(el);
  cards.push(el);
};
const appliance = { remaining_entity: 'sensor.rem', total_entity: 'sensor.tot', program_entity: 'sensor.course', temp_entity: 'sensor.temp', pause_entity: 'button.pause', start_entity: 'button.start' };

add('wall-light-card', { entity: 'light.demo' }, 'tall');
add('wall-switch-card', { entity: 'switch.lamp', label: 'Γραφείο' });
add('wall-lock-card', { entity: 'lock.door', battery_entity: 'sensor.batt' });
add('wall-opener-card', { entity: 'lock.opener' });
add('wall-air-card', { entity: 'sensor.pm25', co2_entity: 'sensor.co2', voc_entity: 'sensor.voc', pm10_entity: 'sensor.pm10' });
add('wall-climate-card', { entity: 'climate.boiler' });
add('wall-climate-card', { entity: 'climate.ac', label: 'Σαλόνι' });
add('wall-boiler-card', { entity: 'climate.boiler' });
add('wall-heater-card', { entity: 'switch.heater', timer_entity: 'timer.heater' });
add('wall-purifier-card', { entity: 'binary_sensor.pur', level_entity: 'input_select.pur', on_entity: 'script.pur_on', off_entity: 'script.pur_off' });
add('wall-switch-card', { entity: 'light.demo', label: 'Παιδικό' });
add('wall-washer-card', { entity: 'input_select.wash', ...appliance });
add('wall-dryer-card', { entity: 'binary_sensor.dry', remaining_entity: 'sensor.dry_rem', total_entity: 'sensor.dry_tot' });
add('wall-dishwasher-card', { entity: 'input_select.dish' });
add('wall-vacuum-card', { entity: 'vacuum.robo', area_entity: 'sensor.area' });
add('wall-tv-card', { entity: 'media_player.tv' }, 'wide');
add('wall-music-card', { entity: 'media_player.music' }, 'wide');
add('wall-car-card', { entity: 'sensor.car', name: 'Model 3', range_entity: 'sensor.range', location_entity: 'device_tracker.car', charging_entity: 'binary_sensor.charging', lock_entity: 'lock.car', climate_entity: 'climate.car', charger_entity: 'switch.charger', locate_entity: 'button.find' }, 'wide');
/* Ακραίες περιπτώσεις: entity που δεν υπάρχει, και κάρτα μόνο με το υποχρεωτικό πεδίο */
add('wall-climate-card', { entity: 'climate.missing' });
add('wall-car-card', { entity: 'sensor.car' }, 'wide');
add('wall-weather-card', { entity: 'weather.home' }, 'wide');
add('wall-person-card', { entity: 'person.chris', distance_entity: 'sensor.chris_dist', address_entity: 'sensor.chris_addr', driving_entity: 'binary_sensor.chris_drv' }, 'wide');
add('wall-person-card', { entity: 'person.ioanna' }, 'wide');
add('wall-dehumidifier-card', { entity: 'humidifier.dehum', humidity_entity: 'sensor.dehum_h', room_entity: 'select.dehum_room', power_entity: 'sensor.dehum_w' });
add('wall-room-card', { entity: 'sensor.home_t', humidity_entity: 'sensor.home_h', name: 'Σπίτι', icon: 'home' }, 'wide');
add('wall-room-card', { entity: 'sensor.lr_t', humidity_entity: 'sensor.lr_h', name: 'Σαλόνι', icon: 'sofa' }, 'wide');
add('wall-room-card', { entity: 'sensor.br_t', humidity_entity: 'sensor.br_h', name: 'Υπνοδωμάτιο', icon: 'bed' }, 'wide');
push();
window.__wall = { states, set, cards };

/* Δείγμα μεγάλου popup με καρτέλες, για έλεγχο του προτύπου */
const { openPopup, popSection, popChips, popStepper } = window.wallCards;
const demo = document.createElement('button');
demo.textContent = 'Δείγμα μεγάλου popup με καρτέλες';
demo.style.cssText = 'margin-top:16px;height:44px;padding:0 16px;border-radius:14px;border:0;font:600 15px sans-serif;background:#fff';
demo.onclick = () => openPopup(cards.find((c) => c.localName === 'wall-vacuum-card'), {
  icon: 'cleaning_services', size: 'lg', status: () => 'Στη βάση · 100%',
  tabs: [{ id: 'rooms', label: 'Δωμάτια', icon: 'meeting_room' }, { id: 'power', label: 'Ισχύς', icon: 'speed' }, { id: 'more', label: 'Ρουτίνες', icon: 'schedule' }],
  render: (p, tab) => {
    if (tab === 'rooms') popChips(popSection(p, 'Καθάρισε'), ['Σαλόνι', 'Κουζίνα', 'Υπνοδωμάτιο', 'Παιδικό', 'Γραφείο', 'Μπάνιο'].map((label, i) => ({ label, sel: i === 1, tap: () => log('δωμάτιο ' + label) })));
    if (tab === 'power') { popStepper(popSection(p, 'Περάσματα'), { text: '2', dec: () => log('−'), inc: () => log('+') }); popChips(popSection(p, 'Αναρρόφηση'), ['Ήσυχη', 'Κανονική', 'Δυνατή', 'Μέγιστη'].map((label, i) => ({ label, sel: i === 1, tap: () => log(label) }))); }
    if (tab === 'more') popChips(popSection(p, 'Ρουτίνες'), [{ label: 'Μετά το φαγητό', icon: 'restaurant', tap: () => log('ρουτίνα') }, { label: 'Όταν λείπουμε', icon: 'directions_walk', tap: () => log('ρουτίνα') }]);
  },
});
document.body.appendChild(demo);
</script>
</body>
</html>

<!doctype html>
<!-- Σελίδα ανάπτυξης: δείχνει τις κάρτες με ψεύτικα entities, χωρίς σύνδεση στο Home Assistant.
     Άνοιγμα: http://<HA>/local/wall-cards/dev/index.html -->
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Cards · dev</title>
<style>
  body{margin:0;padding:24px;background:linear-gradient(160deg,#eef1f4,#dde3e8);min-height:100vh;box-sizing:border-box;font-family:sans-serif}
  #grid{display:grid;grid-template-columns:repeat(4,220px);grid-auto-rows:228px;gap:12px}
  #grid > *{min-height:0}
  .tall{grid-row:span 2}
  pre{font:12px monospace;color:#5b6670;margin-top:16px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="grid"></div>
<pre id="log"></pre>
<script type="module">
import '../dist/wall-cards.js';

const now = () => new Date().toISOString();
const S = (state, attributes = {}) => ({ state, attributes, last_updated: now() });
const states = {
  'light.demo': S('on', { friendly_name: 'Φως υπνοδωματίου', brightness: 160, supported_color_modes: ['brightness'] }),
  'light.plain': S('off', { friendly_name: 'Φως χωρίς dimmer', supported_color_modes: ['onoff'] }),
  'lock.demo': S('locked', { friendly_name: 'Door' }),
  'sensor.batt': S('76', {}),
  'input_select.wash': S('on', {}),
  'sensor.rem': S('0:42:00', {}), 'sensor.tot': S('1:12:00', {}),
  'sensor.course': S('Cotton', {}), 'sensor.temp': S('40℃', {}),
  'button.pause': S('unknown', {}), 'button.start': S('unknown', {}),
};
const cards = [];
const log = (t) => (document.getElementById('log').textContent = t + '\n' + document.getElementById('log').textContent);
const set = (id, state, attrs) => { states[id] = S(state, { ...states[id].attributes, ...attrs }); push(); };
const hass = {
  states,
  callService(domain, service, data) {
    log(`${domain}.${service} ${JSON.stringify(data)}`);
    const id = data.entity_id, cur = states[id];
    setTimeout(() => {
      if (domain === 'light' && service === 'toggle') set(id, cur.state === 'on' ? 'off' : 'on');
      if (domain === 'light' && service === 'turn_on') set(id, 'on', { brightness: Math.round(data.brightness_pct * 2.55) });
      if (domain === 'lock') set(id, service === 'lock' ? 'locked' : 'unlocked');
      if (id === 'button.pause') set('input_select.wash', 'paused');
      if (id === 'button.start') set('input_select.wash', 'on');
    }, 300);
    return Promise.resolve();
  },
};
const push = () => cards.forEach((c) => (c.hass = hass));
const add = (tag, config, cls) => {
  const el = document.createElement(tag);
  el.setConfig(config);
  if (cls) el.className = cls;
  document.getElementById('grid').appendChild(el);
  cards.push(el);
};
add('wall-light-card', { entity: 'light.demo' }, 'tall');
add('wall-lock-card', { entity: 'lock.demo', subtitle: 'Πόρτα διαμερίσματος', battery_entity: 'sensor.batt' });
add('wall-washer-card', { entity: 'input_select.wash', remaining_entity: 'sensor.rem', total_entity: 'sensor.tot', program_entity: 'sensor.course', temp_entity: 'sensor.temp', pause_entity: 'button.pause', start_entity: 'button.start' });
add('wall-light-card', { entity: 'light.plain' }, 'tall');
push();
window.__wall = { states, set, cards };
</script>
</body>
</html>

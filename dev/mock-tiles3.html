<!doctype html>
<html lang="el"><head><meta charset="utf-8"><title>Wall Cards · Εικονίδια με CSS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL@24,400,0..1&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,sans-serif;padding:22px 26px;background:#e9edf1;color:#1c2228}
h1{font:800 20px Manrope;margin:0 0 4px}p.i{color:#6b7680;margin:0 0 16px;font:600 13px Manrope}
.th{border-radius:26px;padding:18px 18px 22px;margin-bottom:18px}.th h2{font:800 15px Manrope;margin:0 0 12px}
.row{display:grid;grid-template-columns:repeat(6,150px);gap:12px}.row+.row{margin-top:12px}
.light{--box:#fff;--ink:#1c2228;--mut:#6b7680;--chip:#fff;--track:rgba(0,0,0,.08);--well:#f2f4f6;background:#eef1f4}
.dark{--box:#1d2227;--ink:#eef1f3;--mut:#8b959e;--chip:#2a3138;--track:rgba(255,255,255,.1);--well:#262d33;background:#14181c;color:#eef1f3}
.ms{font-family:'Material Symbols Rounded';font-feature-settings:'liga';font-size:22px;line-height:1;font-variation-settings:'FILL' 1}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;padding:0}

.t{position:relative;height:150px;border-radius:22px;padding:13px 12px 12px 14px;background:var(--box);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.light .t.on{background:linear-gradient(170deg,color-mix(in srgb,var(--a) 6%,#fff),color-mix(in srgb,var(--a) 18%,#fff))}
.dark .t.on{background:linear-gradient(170deg,color-mix(in srgb,var(--a) 10%,var(--box)),color-mix(in srgb,var(--a) 26%,var(--box)))}
.nm{font:700 12px Manrope;line-height:1.15;padding-right:42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font:600 10.5px Manrope;color:var(--mut);margin-top:2px;padding-right:42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act{position:absolute;right:9px;top:9px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--chip);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.on .act{background:var(--a);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--a) 40%,transparent)}
.bt{margin-top:auto;display:flex;align-items:center;gap:9px}
.v{font:500 26px Manrope;letter-spacing:-1px;line-height:1;white-space:nowrap}.v small{font:600 13px Manrope;color:var(--mut);letter-spacing:0}
.vs{font:600 10.5px Manrope;color:var(--mut);margin-top:3px;white-space:nowrap}

/* δαχτυλίδι προόδου με «παράθυρο» για τη ζωγραφιά */
.rg{position:relative;width:56px;height:56px;flex:none;border-radius:50%;background:conic-gradient(var(--a) 0 var(--p,0%),var(--track) var(--p,0%) 100%)}
.art{position:absolute;inset:5px;border-radius:50%;background:var(--well);overflow:hidden}
.art *{position:absolute}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{to{transform:translateX(-50%) rotate(360deg)}}
@keyframes bub{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.9}100%{transform:translateY(-30px) scale(1.1);opacity:0}}
@keyframes tumble{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes heat{0%{transform:translateY(6px) scaleY(.8);opacity:0}40%{opacity:.8}100%{transform:translateY(-22px) scaleY(1.3);opacity:0}}
@keyframes spray{0%,100%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{transform:translateY(-12px)}}
@keyframes jig{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,2px) rotate(-10deg)}75%{transform:translate(3px,-1px) rotate(8deg)}}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(1.08,.92)}60%{transform:scale(.94,1.08)}}
@keyframes drip{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes slide{0%,100%{transform:translateX(-9px)}50%{transform:translateX(9px)}}
@keyframes blow{0%{transform:translateY(-2px);opacity:0}30%{opacity:.8}100%{transform:translateY(16px);opacity:0}}
@keyframes blink{50%{opacity:.25}}
.off .art *{animation-play-state:paused!important}

/* ΠΛΥΝΤΗΡΙΟ ΡΟΥΧΩΝ — μπλε νερό που κυματίζει, κάδος με τρύπες που γυρίζει, φυσαλίδες σαπουνιού */
.washer .water{width:110px;height:110px;left:50%;top:var(--lvl,60%);border-radius:42%;background:rgba(61,143,230,.45);animation:wave 3s linear infinite;transform-origin:50% 50%}
.washer .drum{inset:6px;border-radius:50%;border:2px dashed rgba(40,80,130,.35);animation:spin 1.8s linear infinite}
.washer .drum::before{content:'';position:absolute;left:50%;top:2px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:rgba(40,80,130,.4)}
.washer .bb{width:6px;height:6px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);bottom:8px;animation:bub 2.2s ease-in infinite}
.dark .washer .drum{border-color:rgba(160,200,240,.35)}

/* ΣΤΕΓΝΩΤΗΡΙΟ — ζεστό πορτοκαλί, ρούχα που «κάνουν τούμπες», κύματα ζέστης */
.dryer .glow{inset:0;background:radial-gradient(circle at 50% 75%,rgba(255,170,70,.55),transparent 70%)}
.dryer .tum{inset:5px;animation:tumble 2.2s cubic-bezier(.6,.1,.4,.9) infinite}
.dryer .tum i{width:16px;height:9px;border-radius:5px}
.dryer .tum i:nth-child(1){left:6px;top:20px;background:#e46a8a;transform:rotate(30deg)}
.dryer .tum i:nth-child(2){left:22px;top:28px;background:#f2b43c;transform:rotate(-20deg)}
.dryer .tum i:nth-child(3){left:14px;top:8px;background:#6aa7e4;transform:rotate(70deg)}
.dryer .ht{width:4px;height:12px;border-radius:2px;background:linear-gradient(transparent,rgba(255,140,50,.8));bottom:4px;animation:heat 1.6s ease-in infinite}

/* ΠΛΥΝΤΗΡΙΟ ΠΙΑΤΩΝ — ράφι με πιάτα όρθια, βραχίονας ψεκασμού που γυρίζει, σταγόνες */
.dish .rack{left:8px;right:8px;bottom:12px;height:22px;display:flex;justify-content:space-between;align-items:flex-end}
.dish .rack b{position:static;width:5px;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,#ffffff,#c9d4dc);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.dish .rack b:nth-child(odd){height:22px}.dish .rack b:nth-child(even){height:17px}
.dish .arm{left:50%;bottom:7px;width:34px;height:4px;margin-left:-17px;border-radius:2px;background:#3aa8b8;animation:spin 1s linear infinite}
.dish .dp{width:3px;height:6px;border-radius:2px;background:#4fc0d0;bottom:12px;animation:spray 1.1s ease-out infinite}
.dish .steam{left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(79,192,208,.25),transparent)}

/* ΣΚΟΥΠΑ — ρομπότ από πάνω που κινείται, βάση με LED */
.vac .dock{left:10px;right:10px;top:4px;height:12px;border-radius:5px 5px 2px 2px;background:linear-gradient(#d5dbe0,#aeb7bf)}
.vac .dock::after{content:'';position:absolute;left:50%;top:4px;width:10px;height:3px;margin-left:-5px;border-radius:2px;background:#5ad08a;box-shadow:0 0 5px #5ad08a}
.vac .bot{left:50%;top:15px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#4a525a,#0e1114);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.vac .bot::after{content:'';position:absolute;left:9px;top:4px;width:10px;height:10px;border-radius:50%;background:#20262b;box-shadow:inset 0 1px 1px rgba(255,255,255,.2)}
.on.vac .bot{animation:jig 2.4s ease-in-out infinite}.on.vac .dock{opacity:.35}

/* ΚΑΘΑΡΙΣΤΗΣ — πέταλα έλικα */
.pur .fan{inset:6px;animation:spin 1.3s linear infinite}
.pur .fan i{left:50%;top:1px;width:9px;height:17px;margin-left:-4.5px;border-radius:50% 50% 40% 40%;background:color-mix(in srgb,var(--a) 60%,transparent);transform-origin:4.5px 17px}

/* ΘΕΡΜΟΣΙΦΩΝΑΣ — φλόγα που τρεμοπαίζει, νερό που ζεσταίνεται */
.heater .tank{left:13px;right:13px;top:6px;bottom:6px;border-radius:10px;background:linear-gradient(#fff,#d9dfe4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.heater .hot{left:13px;right:13px;bottom:6px;height:var(--lvl,30%);border-radius:0 0 10px 10px;background:linear-gradient(rgba(232,96,60,.25),rgba(232,96,60,.6));transition:height 1s}
.heater .fl{left:50%;bottom:9px;width:14px;height:18px;margin-left:-7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#ffd25a,#ff7a2a 60%,#e8452a);transform-origin:50% 100%;animation:flick .9s ease-in-out infinite}
.off.heater .fl{background:#b9c1c8}

/* ΚΛΙΜΑΤΙΣΤΙΚΟ — μονάδα με ζεστό αέρα που βγαίνει */
.ac .unit{left:5px;right:5px;top:12px;height:14px;border-radius:5px;background:linear-gradient(#fff,#dde3e8);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.ac .unit::after{content:'';position:absolute;left:6px;right:6px;bottom:2px;height:2px;border-radius:1px;background:#9aa6b0}
.ac .air{width:3px;height:10px;border-radius:2px;top:28px;background:linear-gradient(var(--a),transparent);animation:blow 1.3s ease-in infinite}

/* ΑΦΥΓΡΑΝΤΗΡΑΣ — σταγόνες που πέφτουν στο δοχείο */
.dehum .tank{left:10px;right:10px;bottom:6px;height:13px;border-radius:2px 2px 8px 8px;background:rgba(61,143,230,.35);box-shadow:inset 0 0 0 1.5px rgba(61,143,230,.5)}
.dehum .dr{left:50%;top:10px;width:9px;height:12px;margin-left:-4.5px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:#3d8fe6;transform:rotate(180deg);animation:drip 1.5s ease-in infinite}
.dehum .dr:nth-child(3){margin-left:-12px;animation-delay:.5s;transform:scale(.7) rotate(180deg)}

/* ΕΚΤΥΠΩΤΗΣ 3D — ακροφύσιο που πάει πέρα-δώθε πάνω από το αντικείμενο που «χτίζεται» */
.printer .bar{left:6px;right:6px;top:12px;height:3px;background:#8b959e}
.printer .noz{left:50%;top:9px;width:10px;height:10px;margin-left:-5px;border-radius:2px 2px 4px 4px;background:#3d4851;animation:slide 1.6s ease-in-out infinite}
.printer .noz::after{content:'';position:absolute;left:3px;bottom:-4px;border:2px solid transparent;border-top:4px solid #ff7a3d}
.printer .obj{left:50%;bottom:8px;width:24px;height:var(--lvl,40%);margin-left:-12px;border-radius:3px 3px 1px 1px;background:repeating-linear-gradient(0deg,#ff8a4d 0 2px,#f26a2a 2px 4px)}
.printer .bed{left:6px;right:6px;bottom:5px;height:3px;border-radius:1px;background:#8b959e}

.pm{display:flex;gap:7px;margin-top:6px}.pm button{flex:1;height:32px;border-radius:16px;background:var(--chip);box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:20px}
.done .act{background:#3fb87a;color:#fff}.light .t.done{background:linear-gradient(170deg,#f2fbf6,#d8f2e3)}.dark .t.done{background:linear-gradient(170deg,#1f2b25,#1f3d2e)}
</style></head><body>
<h1>Εικονίδια με CSS, στο στιλ του αρχικού concept</h1>
<p class="i">Κάθε συσκευή έχει δική της μικρή σκηνή μέσα στο δαχτυλίδι προόδου· κινείται μόνο όταν δουλεύει. Πρώτη σειρά σε λειτουργία, δεύτερη σβηστές ή έτοιμες.</p>
<div id="o"></div>
<script>
const bubbles = [10, 22, 34].map((l, i) => `<i class="bb" style="left:${l}px;animation-delay:${i * .7}s"></i>`).join('');
const heats = [12, 22, 32].map((l, i) => `<i class="ht" style="left:${l}px;animation-delay:${i * .5}s"></i>`).join('');
const drops = [12, 22, 32].map((l, i) => `<i class="dp" style="left:${l}px;animation-delay:${i * .35}s"></i>`).join('');
const airs = [14, 22, 30].map((l, i) => `<i class="air" style="left:${l}px;animation-delay:${i * .4}s"></i>`).join('');
const A = {
  washer: `<i class="water"></i><i class="drum"></i>${bubbles}`,
  dryer: `<i class="glow"></i><i class="tum"><i></i><i></i><i></i></i>${heats}`,
  dish: `<i class="steam"></i><i class="rack"><b></b><b></b><b></b><b></b><b></b></i><i class="arm"></i>${drops}`,
  vac: `<i class="dock"></i><i class="bot"></i>`,
  pur: `<i class="fan">${[0, 72, 144, 216, 288].map((d) => `<i style="transform:rotate(${d}deg)"></i>`).join('')}</i>`,
  heater: `<i class="tank"></i><i class="hot"></i><i class="fl"></i>`,
  ac: `<i class="unit"></i>${airs}`,
  dehum: `<i class="tank"></i><i class="dr"></i><i class="dr"></i>`,
  printer: `<i class="bar"></i><i class="obj"></i><i class="bed"></i><i class="noz"></i>`,
};
const card = (k, st, a, p, nm, sb, btn, v, vs, extra = '', lvl = '') =>
  `<div class="t ${k} ${st}" style="--a:${a}"><div class="nm">${nm}</div><div class="sb">${sb}</div><button class="act ms">${btn}</button>
   <div class="bt"><div class="rg" style="--p:${p}%"><div class="art" style="${lvl}">${A[k]}</div></div><div><div class="v">${v}</div><div class="vs">${vs}</div></div></div>${extra}</div>`;
const R1 = [
  card('washer', 'on', '#3d8fe6', 64, 'Πλυντήριο', 'Βαμβακερά 40°', 'pause', '42<small>′</small>', 'τέλος 21:23', '', '--lvl:40%'),
  card('dryer', 'on', '#f08a2c', 35, 'Στεγνωτήριο', 'Βαμβακερά', 'pause', '1:05', 'τέλος 21:46'),
  card('dish', 'on', '#2fb0c0', 18, 'Πλυντήριο πιάτων', 'Eco 50°', 'pause', '2:10', 'τέλος 22:51'),
  card('vac', 'on', '#3fb87a', 45, 'Σκούπα', 'Καθαρίζει · Σαλόνι', 'pause', '27<small> m²</small>', 'καθαρίστηκαν'),
  card('pur', 'on', '#3fb87a', 84, 'Καθαριστής', 'Καλή · Auto', 'power_settings_new', '8', 'PM2.5 µg/m³'),
  card('printer', 'on', '#f26a2a', 40, 'Εκτυπωτής 3D', 'Τυπώνει · Benchy', 'pause', '1:54', 'τέλος 17:40', '', '--lvl:40%'),
];
const R2 = [
  card('washer', 'off', '#3d8fe6', 0, 'Πλυντήριο', 'Σβηστό', 'play_arrow', '<small>—</small>', 'τελευταία χθες', '', '--lvl:85%'),
  card('dryer', 'done', '#3fb87a', 100, 'Στεγνωτήριο', 'Έτοιμο · πάτα για OK', 'check', '1:12', '1,8 kWh'),
  card('dish', 'off', '#2fb0c0', 0, 'Πλυντήριο πιάτων', 'Σβηστό', 'play_arrow', '<small>—</small>', 'τελευταία πριν 3ω'),
  card('heater', 'on', '#e8603c', 55, 'Θερμοσίφωνας', 'Ζεσταίνει', 'power_settings_new', '12<small>′</small>', 'τέλος 18:10', '', '--lvl:55%'),
  card('ac', 'on', '#ff7a3d', 0, 'Κλιματιστικό', 'Θέρμανση · χώρος 28°', 'power_settings_new', '26°', '', '<div class="pm"><button class="ms">remove</button><button class="ms">add</button></div>'),
  card('dehum', 'on', '#3d8fe6', 67, 'Αφυγραντήρας', 'Στόχος 55%', 'power_settings_new', '67<small>%</small>', 'δοχείο 40%'),
];
document.getElementById('o').innerHTML = ['light', 'dark'].map((th) => `<div class="th ${th}"><h2>${th === 'light' ? 'Ανοιχτό θέμα' : 'Σκούρο θέμα'}</h2><div class="row">${R1.join('')}</div><div class="row">${R2.join('')}</div></div>`).join('');
</script></body></html>
